<title>Revisión completa — remoción de marcas de agua</title>
<style>
  :root {
    --bg: #F7F5F1; --surface: #FFFFFF; --ink: #23211D; --muted: #706B60;
    --accent: #B8863A; --border: #E4E0D8; --mono-bg: #F1EEE7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17150F; --surface: #211F19; --ink: #F2EFE9; --muted: #A8A092; --accent: #E0BD74; --border: #332F26; --mono-bg: #2A2720; }
  }
  :root[data-theme="dark"] { --bg: #17150F; --surface: #211F19; --ink: #F2EFE9; --muted: #A8A092; --accent: #E0BD74; --border: #332F26; --mono-bg: #2A2720; }
  :root[data-theme="light"] { --bg: #F7F5F1; --surface: #FFFFFF; --ink: #23211D; --muted: #706B60; --accent: #B8863A; --border: #E4E0D8; --mono-bg: #F1EEE7; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 1320px; margin: 0 auto; padding: 44px 32px 80px; }

  header.masthead { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 36px; }
  .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
  h1 { font-family: Charter, "Iowan Old Style", Georgia, serif; font-size: clamp(24px, 3.4vw, 32px); font-weight: 600; margin: 0 0 12px; text-wrap: balance; }
  .meta { color: var(--muted); font-size: 14px; max-width: 72ch; }
  .meta code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--mono-bg); padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }

  h2 {
    font-family: Charter, "Iowan Old Style", Georgia, serif; font-weight: 600; font-size: 20px;
    text-transform: capitalize; margin: 0 0 4px; padding-top: 8px; border-top: 2px solid var(--accent);
    display: flex; align-items: baseline; gap: 10px;
  }
  h2 .count { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 400; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 18px 0 44px; }

  figure.pair { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .pair-imgs { display: grid; grid-template-columns: 1fr 1fr; }
  .pair-imgs img { display: block; width: 100%; height: 140px; object-fit: contain; background: var(--mono-bg); }
  .pair-imgs img:first-child { border-right: 1px solid var(--border); }
  figcaption {
    padding: 7px 9px; border-top: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--ink); word-break: break-word;
  }

  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .l1::before { background: #999; }
  .legend .l2::before { background: var(--accent); }
</style>
<div class="page">
  <header class="masthead">
    <p class="eyebrow">MOVARA × Heshi — revisión antes / después</p>
    <h1>69 imágenes procesadas — original vs. limpia</h1>
    <p class="meta">
      Cada tarjeta muestra <strong>original</strong> (izquierda) y <strong>resultado con <code>cv.inpaint</code></strong> (derecha).
      Los resultados están en <code>public/configurador-clean/</code> — nada se sobrescribió todavía en <code>public/configurador/</code>.
    </p>
  </header>
